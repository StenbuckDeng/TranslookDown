name: Build TranslookDown

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install yt-dlp and ffmpeg via Homebrew
        run: |
          brew install yt-dlp ffmpeg
          mkdir -p bundle
          cp "$(which yt-dlp)"  bundle/yt-dlp
          cp "$(which ffmpeg)"  bundle/ffmpeg
          cp "$(which ffprobe)" bundle/ffprobe
          chmod +x bundle/yt-dlp bundle/ffmpeg bundle/ffprobe
          echo "yt-dlp: $(bundle/yt-dlp --version)"

      - name: Build macOS app
        run: |
          pyinstaller \
            --name "TranslookDown" \
            --windowed \
            --onedir \
            --noconfirm \
            --add-data "config:config" \
            --add-data "license:license" \
            --add-binary "bundle/yt-dlp:bundle" \
            --add-binary "bundle/ffmpeg:bundle" \
            --add-binary "bundle/ffprobe:bundle" \
            --hidden-import "flask" \
            --hidden-import "flask_cors" \
            --hidden-import "webview" \
            --hidden-import "cryptography" \
            --hidden-import "PIL" \
            --hidden-import "qrcode" \
            src/video_downloader.py

      - name: Zip .app
        run: |
          cd dist
          zip -r TranslookDown-macOS.zip TranslookDown.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslookDown-macOS
          path: dist/TranslookDown-macOS.zip
          retention-days: 30

  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download yt-dlp and ffmpeg for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bundle/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter "ffmpeg.exe")[0].FullName  bundle/ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter "ffprobe.exe")[0].FullName bundle/ffprobe.exe
          Write-Host "yt-dlp: $(bundle/yt-dlp.exe --version)"

      - name: Build Windows exe
        run: |
          pyinstaller `
            --name "TranslookDown" `
            --windowed `
            --onedir `
            --noconfirm `
            --add-data "config;config" `
            --add-data "license;license" `
            --add-binary "bundle/yt-dlp.exe;bundle" `
            --add-binary "bundle/ffmpeg.exe;bundle" `
            --add-binary "bundle/ffprobe.exe;bundle" `
            --hidden-import "flask" `
            --hidden-import "flask_cors" `
            --hidden-import "webview" `
            --hidden-import "cryptography" `
            --hidden-import "PIL" `
            --hidden-import "qrcode" `
            src/video_downloader.py

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TranslookDown -DestinationPath dist/TranslookDown-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslookDown-Windows
          path: dist/TranslookDown-Windows.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: TranslookDown-macOS
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TranslookDown-Windows
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          name: "TranslookDown ${{ github.ref_name }}"
